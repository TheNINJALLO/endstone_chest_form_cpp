[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-chestform-api"
version = "1.0.21"
description = "Python developer stubs and client wrapper for the native C++ ChestFormAPI Endstone plugin"
readme = "README.md"
authors = [{ name = "TheNINJALLO" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "endstone>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
